{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Expense</title>
    <link rel="stylesheet" href="{% static 'css/tabulator.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/monthly_list.css' %}">
    <link rel="stylesheet" href="{% static 'css/add_item.css' %}">
</head>
<body>
    <div class="expense-page">
        <div class="expense-card" id="monthly-expense-page"
             data-summary-url="{% url 'expense:monthly_summary_api' %}"
             data-detail-url-template="{% url 'expense:day_detail_api' 0 0 0 %}"
             data-add-url="{% url 'expense:add_item' %}"
             data-edit-url-template="{% url 'expense:edit_item' 0 %}"
             data-delete-url-template="{% url 'expense:delete_item' 0 %}">
            <div class="toolbar">
                <div class="toolbar-left"><h2>Monthly Expense</h2></div>
                <div class="toolbar-right"><a href="{% url 'expense:add_item' %}">Add Expense →</a></div>
            </div>

            <div class="filter-section">
                <div class="filter-group">
                    <label for="year-filter">Year</label>
                    <select id="year-filter"></select>
                </div>
                <div class="filter-group">
                    <label for="month-filter">Month</label>
                    <select id="month-filter">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
            </div>

            <div class="expense-layout">
                <div class="left-panel">
                    <div class="panel-header"><h3 id="monthly-heading">Monthly Overview</h3></div>
                    <div id="days-grid"></div>
                </div>
                <div class="right-panel">
                    <div class="panel-header">
                        <h3 id="day-heading">Daily Expenses</h3>
                        <button type="button" class="btn-add monthly-add-button" id="open-monthly-add">Add Expense</button>
                    </div>
                    <div class="day-summary">
                        <div class="day-summary-stat">
                            <span class="day-summary-label">Date</span>
                            <strong id="selected-day-date">-</strong>
                        </div>
                        <div class="day-summary-stat">
                            <span class="day-summary-label">Items purchased</span>
                            <strong id="selected-day-items">0</strong>
                        </div>
                        <div class="day-summary-stat">
                            <span class="day-summary-label">Total spent</span>
                            <strong id="selected-day-total">৳0.00</strong>
                        </div>
                    </div>
                    <div id="detail-grid"></div>
                </div>
            </div>
        </div>
    </div>

    {% include 'expense/partials/edit_expense_modal.html' %}
    {% include 'expense/partials/monthly_add_expense_modal.html' %}
    <script src="{% static 'js/tabulator.min.js' %}"></script>
    <script src="{% static 'js/expense/monthly_list.js' %}"></script>
</body>
</html>
