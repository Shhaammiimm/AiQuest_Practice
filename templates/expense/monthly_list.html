{% load static %}
{% block content %}

<h2>Monthly Expense</h2>

<div class="expense-layout">

    <!-- LEFT SIDE -->
    <div class="left-panel">
        <h3>Monthly Summary</h3>
        <div id="days-grid"></div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">
        <h3>Day Details</h3>
        <div id="detail-grid"></div>
    </div>

</div>
<link rel="stylesheet" href="{% static 'css/handsontable.min.css' %}">

<link rel="stylesheet" href="{% static 'css/ht-theme-main.min.css' %}">

<script src="{% static 'js/handsontable.full.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/tabulator.min.css' %}">
<script src="{% static 'js/tabulator.min.js' %}"></script>
<script>
const year = new Date().getFullYear();
const month = new Date().getMonth() + 1;

const daysTable = new Tabulator("#days-grid", {
    ajaxURL: "{% url 'expense:monthly_summary_api' %}",
    ajaxParams: {
        year: year,
        month: month
    },
    layout: "fitColumns",

    columns: [
        {
            title: "Day",
            field: "day",
            width: 70,
            sorter: "number"
        },
        {
            title: "Date",
            field: "date"
        },
        {
            title: "Total",
            field: "total",
            sorter: "number",
            formatter: "money",
            formatterParams: {
                symbol: "৳ "
            }
        },
        {
            title: "Items",
            field: "count",
            sorter: "number"
        },
    ],
});


const detailTable = new Tabulator("#detail-grid", {
    layout: "fitColumns",

    placeholder: "Nothing to display",

    columns: [
        {
            title: "Item Name",
            field: "name"
        },
        {
            title: "Price",
            field: "price",
            formatter: "money",
            formatterParams: {
                symbol: "৳ "
            }
        },
        {
            title: "Quantity",
            field: "quantity"
        },
        {
            title: "Total",
            field: "total",
            formatter: "money",
            formatterParams: {
                symbol: "৳ "
            }
        },
    ],
});


daysTable.on("rowClick", function(e, row) {

    const rowData = row.getData();

    // if (rowData.count === 0) {
    //     return;
    // }

    const url =
        `/expense/api/day/${year}/${month}/${rowData.day}/`;

    detailTable.setData(url);

    daysTable.deselectRow();
    row.select();
});

</script>


<style>

.expense-layout {
    display: grid;
    grid-template-columns: 40% 60%;
    gap: 20px;
    width: 100%;
}

.left-panel,
.right-panel {
    min-width: 0;
}

#days-grid {
    width: 100%;
    height: 600px;
}

#detail-grid {
    width: 100%;
    height: 600px;
}

</style>

{% endblock %}
