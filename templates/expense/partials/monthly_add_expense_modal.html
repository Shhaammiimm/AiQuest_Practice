<div class="modal" id="monthly-add-modal">
    <div class="modal-content monthly-add-content">
        <div class="modal-header">
            <h3>Add Expense</h3>
            <button type="button" class="modal-close" data-close-monthly-add>&times;</button>
        </div>

        <form method="post" id="monthly-add-form">
            {% csrf_token %}
            <div class="edit-grid">
                <div class="form-group required-field">
                    <label for="monthly-add-name">Item Name</label>
                    <input type="text" id="monthly-add-name" name="name" required>
                </div>
                <div class="form-group required-field">
                    <label for="monthly-add-price">Price</label>
                    <input type="number" id="monthly-add-price" name="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="monthly-add-quantity">Quantity</label>
                    <input type="number" id="monthly-add-quantity" name="quantity" value="1" step="0.01">
                </div>
                <div class="form-group">
                    <label for="monthly-add-location">Purchase Location</label>
                    <input type="text" id="monthly-add-location" name="location">
                </div>
                <div class="form-group required-field">
                    <label for="monthly-add-date">Expense Date</label>
                    <input type="date" id="monthly-add-date" name="date" readonly required>
                </div>
                <div class="form-group">
                    <label for="monthly-add-total">Total Amount</label>
                    <div class="total-field" id="monthly-add-total">৳ <span>0.00</span></div>
                </div>
                <div class="form-group full-width">
                    <label for="monthly-add-description">Description</label>
                    <textarea id="monthly-add-description" name="description" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" data-close-monthly-add>Cancel</button>
                <button type="submit" class="btn-save">Add Expense</button>
            </div>
        </form>
    </div>
</div>
