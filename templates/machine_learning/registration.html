<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        {% for field in forms_data %}
            <p>
                {{ field.label_tag }} {{ field }} <br> <br>
            </p>
        {% endfor %}
        <input type="submit" value="Register">
    </form>
</body>
</html>
