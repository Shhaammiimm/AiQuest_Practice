{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'expense:monthly_list' %}">Expense Tracker</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-light me-2">Hi, {{ user.username }}</span>
                    <a class="btn btn-outline-light btn-sm" href="{% url 'expense:add_item' %}">+ Add Item</a>
                    <a class="btn btn-outline-danger btn-sm" href="{% url 'accounts:logout' %}">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:login' %}">Login</a>
                    <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
